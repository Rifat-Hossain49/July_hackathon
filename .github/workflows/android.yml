name: Android software evidence

on:
  push:
    branches:
      - main
      - feat/software-complete-release-candidate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Kotlin vectors and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run Kotlin conformance and assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :core-conformance:testDebugUnitTest :app:assembleDebug
      - name: Upload inspectable software evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-conformance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            android/core-conformance/build/reports/tests/
            android/core-conformance/build/reports/conformance/
            android/app/build/outputs/apk/debug/app-debug.apk

  emulator-smoke:
    name: API 35 emulator install and launch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install pinned Android SDK components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Enable KVM access
        run: |
          sudo usermod -aG kvm "$USER"
          sudo chmod 0666 /dev/kvm
      - name: Build, install and launch on a software emulator
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./android/gradlew -p android --no-daemon :app:assembleDebug
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n org.shongket.app/.MainActivity
            adb shell pidof org.shongket.app
