name: BDIX domestic hub software evidence

on:
  push:
    branches:
      - main
      - feat/bdix-domestic-hub
    paths:
      - bdix_hub/**
      - deploy/bdix/**
      - tests/test_bdix_hub.py
      - tests/test_bdix_hub_static.py
      - tests/test_bdix_backup.py
      - .github/workflows/bdix-hub.yml
  pull_request:
    paths:
      - bdix_hub/**
      - deploy/bdix/**
      - tests/test_bdix_hub.py
      - tests/test_bdix_hub_static.py
      - tests/test_bdix_backup.py
      - .github/workflows/bdix-hub.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bdix-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Strict API, browser shell and production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python 3.14
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14"
      - name: Install pinned test and production runners
        run: python -m pip install pytest==9.1.1 -r deploy/bdix/requirements.txt
      - name: Compile hub and deployment helper
        run: python -m compileall -q bdix_hub deploy
      - name: Run BH software evidence
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q
          tests/test_bdix_hub.py
          tests/test_bdix_hub_static.py
          tests/test_bdix_backup.py
      - name: Smoke-test the production WSGI command
        env:
          SHONGKET_HUB_DB: ${{ runner.temp }}/shongket-hub-smoke.sqlite3
          SHONGKET_HUB_ORIGIN: http://127.0.0.1:8787
        run: |
          gunicorn \
            --bind 127.0.0.1:8787 \
            --workers 1 \
            --threads 2 \
            --worker-class gthread \
            --access-logfile /dev/null \
            bdix_hub.app:application &
          hub_pid=$!
          trap 'kill "$hub_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8787/healthz > /tmp/health.json; then
              python -m json.tool /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          exit 1
